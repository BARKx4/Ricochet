[workspace]
resolver = "2"
members = [
  "crates/ricochet_syntax",
  "crates/ricochet_bytecode",
  "crates/ricochet_vm",
  "crates/ricochet_compiler",
  "crates/ricochet_web",
  "crates/ricochet_cli",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.1.19-rc.4"

[workspace.dependencies]
anyhow = "1"
argon2 = "0.5"
axum = "0.7"
base64 = "0.22"
bytes = "1"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
flate2 = "1"
getrandom = "0.3"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
tar = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
regex = "1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
mysql_async = { version = "0.37", default-features = false, features = ["default-rustls-ring"] }
multer = "3.1.0"
portable-pty = "0.9"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
sha2 = "0.10"
tempfile = "3"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-postgres = "0.7.18"
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring", "webpki-roots"] }
toml = "0.8"
toml_edit = "0.22"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace"] }
tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
wait-timeout = "0.2"
