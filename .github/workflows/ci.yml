name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Test Linux release version guard
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: bash scripts/test-linux-release-version.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Install Linux GUI build dependencies
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Run benchmark smoke
        run: cargo run -p ricochet_cli --bin rco -- bench --smoke

      - name: Install cargo-audit
        shell: pwsh
        run: |
          $exitCode = 0
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            cargo install cargo-audit --locked
            $exitCode = $LASTEXITCODE
            if ($exitCode -eq 0) {
              exit 0
            }

            if ($attempt -lt 3) {
              Write-Warning "cargo-audit install failed with exit code $exitCode; retrying..."
              Start-Sleep -Seconds (10 * $attempt)
            }
          }

          exit $exitCode

      - name: Run cargo-audit
        run: cargo audit --deny warnings

      - name: Install cargo-about
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cargo install cargo-about --version 0.9.1 --locked --features cli

      - name: Run acceptance suite
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: .\scripts\acceptance.ps1

      - name: Validate public Learn manual
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: .\scripts\validate-learn-manual.ps1 -RequireWordCoverage -RequireJekyllRawBlocks
