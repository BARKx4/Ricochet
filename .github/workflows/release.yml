name: Release

on:
  schedule:
    # Build nightly packages from main at 08:17 UTC.
    - cron: "17 8 * * *"
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package, without the leading v. Defaults to Cargo.toml."
        required: false
        type: string

permissions:
  contents: write

jobs:
  resolve-version:
    name: Resolve package version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_nightly: ${{ steps.version.outputs.is_nightly }}

    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Resolve package version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          workspace_version="$(awk -F '"' '/^\[workspace\.package\]/{found=1; next} found && /^[[:space:]]*version[[:space:]]*=/{print $2; exit}' Cargo.toml)"
          if [[ -z "$workspace_version" ]]; then
            echo "Could not resolve workspace.package version from Cargo.toml." >&2
            exit 1
          fi

          version="${REQUESTED_VERSION#v}"
          is_nightly=false

          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            version="${workspace_version}-nightly.${GITHUB_RUN_NUMBER}"
            is_nightly=true
          elif [[ -z "$version" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ -z "$version" ]]; then
            version="$workspace_version"
          fi

          if [[ -z "$version" ]]; then
            echo "Could not resolve a package version." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "is_nightly=$is_nightly" >> "$GITHUB_OUTPUT"
          {
            echo "### Ricochet package version"
            echo
            echo "- Version: \`$version\`"
            echo "- Nightly: \`$is_nightly\`"
          } >> "$GITHUB_STEP_SUMMARY"

  package-windows:
    name: Package Windows release
    needs: resolve-version
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build release package
        shell: pwsh
        run: |
          $version = '${{ needs.resolve-version.outputs.version }}'
          .\scripts\package-release.ps1 -Version $version -Target windows-x64 -RequireInstaller

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: ricochet-${{ needs.resolve-version.outputs.version }}-windows-x64
          path: |
            dist/*.zip
            dist/*-setup.exe
          retention-days: 30

  package-linux:
    name: Package Linux release
    needs: resolve-version
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux GUI build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev

      - name: Build release package
        shell: bash
        run: |
          version='${{ needs.resolve-version.outputs.version }}'
          args=(--target linux-x64 --version "$version")
          bash scripts/package-release-linux.sh "${args[@]}"

      - name: Smoke-test package executable
        shell: bash
        run: |
          version='${{ needs.resolve-version.outputs.version }}'

          tmp="$(mktemp -d)"
          tar -xzf dist/ricochet-v*-linux-x64.tar.gz -C "$tmp"
          package_dir="$(find "$tmp" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          "$package_dir/rco" package examples/basic-oop.rco \
            --output "$tmp/basic-oop" \
            --linux-package tar \
            --linux-package deb \
            --package-name basic-oop \
            --package-version "$version"
          "$tmp/basic-oop" | grep -q 'ada@example.com'
          test -f "$tmp/basic-oop-v${version}-linux-x64.tar.gz"
          test -f "$tmp/basic-oop_${version}_amd64.deb"
          dpkg-deb --info "$tmp/basic-oop_${version}_amd64.deb" | grep -q 'Package: basic-oop'

          "$package_dir/rco" package examples/webview_ui.rco \
            --gui \
            --output "$tmp/webview-ui" \
            --linux-package deb \
            --package-name webview-ui \
            --package-version "$version"
          RICOCHET_GUI_EXPORT_HTML="$tmp/webview-ui.html" "$tmp/webview-ui"
          grep -q '<title>Ricochet Desktop UI</title>' "$tmp/webview-ui.html"
          test -f "$tmp/webview-ui_${version}_amd64.deb"
          dpkg-deb --info "$tmp/webview-ui_${version}_amd64.deb" | grep -q 'Depends: libwebkit2gtk-4.1-0, libgtk-3-0'

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: ricochet-${{ needs.resolve-version.outputs.version }}-linux-x64
          path: |
            dist/*.tar.gz
            dist/*.deb
          retention-days: 30

  package-macos:
    name: Package macOS release (${{ matrix.target }})
    needs: resolve-version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-15
          - target: macos-x64
            runner: macos-15-intel

    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release package
        shell: bash
        run: |
          version='${{ needs.resolve-version.outputs.version }}'
          args=(--target '${{ matrix.target }}' --version "$version")
          bash scripts/package-release-macos.sh "${args[@]}"

      - name: Smoke-test package executable
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          tar -xzf dist/ricochet-v*-${{ matrix.target }}.tar.gz -C "$tmp"
          package_dir="$(find "$tmp" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          "$package_dir/rco" package examples/basic-oop.rco --output "$tmp/basic-oop"
          "$tmp/basic-oop" | grep -q 'ada@example.com'
          "$package_dir/rco" package examples/webview_ui.rco --gui --output "$tmp/webview-ui"
          RICOCHET_GUI_EXPORT_HTML="$tmp/webview-ui.html" "$tmp/webview-ui"
          grep -q '<title>Ricochet Desktop UI</title>' "$tmp/webview-ui.html"

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: ricochet-${{ needs.resolve-version.outputs.version }}-${{ matrix.target }}
          path: |
            dist/*.tar.gz
          retention-days: 30

  publish-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - resolve-version
      - package-windows
      - package-linux
      - package-macos
    runs-on: ubuntu-latest

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Write checksums
        shell: bash
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -printf '%f\n' \
            | sort \
            | xargs sha256sum > SHA256SUMS.txt

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t assets < <(find dist -maxdepth 1 -type f | sort)
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Ricochet $GITHUB_REF_NAME" \
            --notes "Windows, Linux, and unsigned macOS release packages for Ricochet $GITHUB_REF_NAME."
