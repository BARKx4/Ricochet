name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package, without the leading v. Defaults to Cargo.toml."
        required: false
        type: string

permissions:
  contents: write

jobs:
  package-windows:
    name: Package Windows release
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build release package
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}'
          if ([string]::IsNullOrWhiteSpace($version) -and $env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
          }

          .\scripts\package-release.ps1 -Version $version -Target windows-x64 -RequireInstaller

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ricochet-windows-x64
          path: |
            dist/*.zip
            dist/*-setup.exe

  package-linux:
    name: Package Linux release
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux GUI build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev

      - name: Build release package
        shell: bash
        run: |
          version='${{ inputs.version }}'
          if [[ -z "$version" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi

          args=(--target linux-x64)
          if [[ -n "$version" ]]; then
            args+=(--version "$version")
          fi
          bash scripts/package-release-linux.sh "${args[@]}"

      - name: Smoke-test package executable
        shell: bash
        run: |
          version='${{ inputs.version }}'
          if [[ -z "$version" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          if [[ -z "$version" ]]; then
            version="$(awk -F '"' '/^\[workspace\.package\]/{found=1; next} found && /^[[:space:]]*version[[:space:]]*=/{print $2; exit}' Cargo.toml)"
          fi

          tmp="$(mktemp -d)"
          tar -xzf dist/ricochet-v*-linux-x64.tar.gz -C "$tmp"
          package_dir="$(find "$tmp" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          "$package_dir/rco" package examples/basic-oop.rco \
            --output "$tmp/basic-oop" \
            --linux-package tar \
            --linux-package deb \
            --package-name basic-oop \
            --package-version "$version"
          "$tmp/basic-oop" | grep -q 'ada@example.com'
          test -f "$tmp/basic-oop-v${version}-linux-x64.tar.gz"
          test -f "$tmp/basic-oop_${version}_amd64.deb"
          dpkg-deb --info "$tmp/basic-oop_${version}_amd64.deb" | grep -q 'Package: basic-oop'

          "$package_dir/rco" package examples/webview_ui.rco \
            --gui \
            --output "$tmp/webview-ui" \
            --linux-package deb \
            --package-name webview-ui \
            --package-version "$version"
          RICOCHET_GUI_EXPORT_HTML="$tmp/webview-ui.html" "$tmp/webview-ui"
          grep -q '<title>Ricochet Desktop UI</title>' "$tmp/webview-ui.html"
          test -f "$tmp/webview-ui_${version}_amd64.deb"
          dpkg-deb --info "$tmp/webview-ui_${version}_amd64.deb" | grep -q 'Depends: libwebkit2gtk-4.1-0, libgtk-3-0'

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ricochet-linux-x64
          path: |
            dist/*.tar.gz
            dist/*.deb

  package-macos:
    name: Package macOS release (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-15
          - target: macos-x64
            runner: macos-15-intel

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release package
        shell: bash
        run: |
          version='${{ inputs.version }}'
          if [[ -z "$version" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi

          args=(--target '${{ matrix.target }}')
          if [[ -n "$version" ]]; then
            args+=(--version "$version")
          fi
          bash scripts/package-release-macos.sh "${args[@]}"

      - name: Smoke-test package executable
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          tar -xzf dist/ricochet-v*-${{ matrix.target }}.tar.gz -C "$tmp"
          package_dir="$(find "$tmp" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          "$package_dir/rco" package examples/basic-oop.rco --output "$tmp/basic-oop"
          "$tmp/basic-oop" | grep -q 'ada@example.com'
          "$package_dir/rco" package examples/webview_ui.rco --gui --output "$tmp/webview-ui"
          RICOCHET_GUI_EXPORT_HTML="$tmp/webview-ui.html" "$tmp/webview-ui"
          grep -q '<title>Ricochet Desktop UI</title>' "$tmp/webview-ui.html"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ricochet-${{ matrix.target }}
          path: |
            dist/*.tar.gz

  publish-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - package-windows
      - package-linux
      - package-macos
    runs-on: ubuntu-latest

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write checksums
        shell: bash
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -printf '%f\n' \
            | sort \
            | xargs sha256sum > SHA256SUMS.txt

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t assets < <(find dist -maxdepth 1 -type f | sort)
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Ricochet $GITHUB_REF_NAME" \
            --notes "Windows, Linux, and unsigned macOS release packages for Ricochet $GITHUB_REF_NAME."
