name: Release

on:
  schedule:
    # Build nightly packages from main at 08:17 UTC.
    - cron: "17 8 * * *"
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package, without the leading v. Defaults to Cargo.toml."
        required: false
        type: string

permissions:
  contents: write

jobs:
  resolve-version:
    name: Resolve package version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_nightly: ${{ steps.version.outputs.is_nightly }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      release_channel: ${{ steps.version.outputs.release_channel }}

    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Resolve package version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          workspace_version="$(awk -F '"' '/^\[workspace\.package\]/{found=1; next} found && /^[[:space:]]*version[[:space:]]*=/{print $2; exit}' Cargo.toml)"
          if [[ -z "$workspace_version" ]]; then
            echo "Could not resolve workspace.package version from Cargo.toml." >&2
            exit 1
          fi

          version="${REQUESTED_VERSION#v}"
          is_nightly=false
          is_prerelease=false
          release_channel=stable

          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            version="${workspace_version}-nightly.${GITHUB_RUN_NUMBER}"
            is_nightly=true
          elif [[ -z "$version" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ -z "$version" ]]; then
            version="$workspace_version"
          fi

          if [[ -z "$version" ]]; then
            echo "Could not resolve a package version." >&2
            exit 1
          fi

          if [[ "$is_nightly" != "true" && "$version" != "$workspace_version" ]]; then
            echo "Resolved package version '$version' does not match workspace Cargo version '$workspace_version'." >&2
            echo "Use the Cargo.toml version for tagged/manual releases; only scheduled nightlies append a suffix." >&2
            exit 1
          fi

          if [[ "$is_nightly" != "true" && "$version" == *-* ]]; then
            is_prerelease=true
            release_channel=candidate
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "is_nightly=$is_nightly" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"
          echo "release_channel=$release_channel" >> "$GITHUB_OUTPUT"
          {
            echo "### Ricochet package version"
            echo
            echo "- Version: \`$version\`"
            echo "- Workspace version: \`$workspace_version\`"
            echo "- Nightly: \`$is_nightly\`"
            echo "- Prerelease: \`$is_prerelease\`"
            echo "- Release channel: \`$release_channel\`"
          } >> "$GITHUB_STEP_SUMMARY"

  package-windows:
    name: Package Windows release
    needs: resolve-version
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install NSIS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidatePaths = @(
            (Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'),
            (Join-Path $env:ProgramFiles 'NSIS\makensis.exe')
          )

          $makensis = $candidatePaths | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          for ($attempt = 1; -not $makensis -and $attempt -le 3; $attempt++) {
            Write-Host "Installing NSIS with Chocolatey (attempt $attempt of 3)."
            choco install nsis -y --no-progress
            $makensis = $candidatePaths | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
            if (-not $makensis -and $attempt -lt 3) {
              Start-Sleep -Seconds (10 * $attempt)
            }
          }

          if (-not $makensis) {
            throw "NSIS makensis.exe was not found after installation attempts."
          }

          "NSIS_PATH=$makensis" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Using NSIS at $makensis"

      - name: Import Windows signing certificate
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          RICOCHET_WINDOWS_CERT_PFX_BASE64: ${{ secrets.RICOCHET_WINDOWS_CERT_PFX_BASE64 }}
          RICOCHET_WINDOWS_CERT_PASSWORD: ${{ secrets.RICOCHET_WINDOWS_CERT_PASSWORD }}
          RICOCHET_WINDOWS_CERT_SHA1: ${{ secrets.RICOCHET_WINDOWS_CERT_SHA1 }}
        run: |
          .\scripts\setup-windows-signing-certificate.ps1 -Required

      - name: Build release package
        shell: pwsh
        env:
          RICOCHET_WINDOWS_TIMESTAMP_URL: ${{ vars.RICOCHET_WINDOWS_TIMESTAMP_URL }}
        run: |
          $version = '${{ needs.resolve-version.outputs.version }}'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $signingMode = 'require'
          } elseif ('${{ needs.resolve-version.outputs.is_nightly }}' -eq 'true') {
            $signingMode = 'auto'
          } else {
            $signingMode = 'dry-run'
          }
          .\scripts\package-release.ps1 -Version $version -Target windows-x64 -RequireInstaller -NsisPath $env:NSIS_PATH -SigningMode $signingMode

      - name: Smoke-test package executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ needs.resolve-version.outputs.version }}'
          $tmp = Join-Path $env:RUNNER_TEMP ("ricochet-windows-smoke-" + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $tmp | Out-Null

          $zip = Get-ChildItem -LiteralPath dist -Filter 'ricochet-v*-windows-x64.zip' | Select-Object -First 1
          if (-not $zip) {
            throw "Windows portable ZIP was not found in dist."
          }
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $tmp
          $rcoCandidates = @(Get-ChildItem -LiteralPath $tmp -Recurse -File -Filter 'rco.exe')
          if ($rcoCandidates.Count -ne 1) {
            throw "Expected exactly one rco.exe in the expanded Windows package, found $($rcoCandidates.Count)."
          }
          $rco = $rcoCandidates[0].FullName
          $packageDir = Split-Path -Parent $rco

          $basic = Join-Path $tmp 'basic-oop.exe'
          $basicSource = Join-Path $packageDir 'examples\basic-oop.rco'
          & $rco package $basicSource --output $basic --package-name basic-oop --package-version $version
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged rco failed to package basic-oop."
          }
          $basicOutput = & $basic
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged basic-oop executable failed."
          }
          if (($basicOutput -join "`n") -notmatch 'ada@example.com') {
            throw "Packaged basic-oop executable output did not contain ada@example.com."
          }

          $webview = Join-Path $tmp 'webview-ui.exe'
          $webviewSource = Join-Path $packageDir 'examples\webview_ui.rco'
          & $rco package $webviewSource --gui --output $webview --package-name webview-ui --package-version $version
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged rco failed to package webview-ui."
          }
          $env:RICOCHET_GUI_EXPORT_HTML = Join-Path $tmp 'webview-ui.html'
          $webviewProcess = Start-Process -FilePath $webview -Wait -PassThru
          if ($webviewProcess.ExitCode -ne 0) {
            throw "Packaged webview-ui executable failed with exit code $($webviewProcess.ExitCode)."
          }
          if (-not (Select-String -LiteralPath $env:RICOCHET_GUI_EXPORT_HTML -Pattern '<title>Ricochet Desktop UI</title>' -Quiet)) {
            throw "Packaged webview-ui HTML export did not contain the expected title."
          }

      - name: Validate release artifact manifest
        shell: pwsh
        run: |
          .\scripts\validate-release-artifacts.ps1 `
            -Target windows-x64 `
            -PackageVersion '${{ needs.resolve-version.outputs.version }}' `
            -RequireInstaller

      - name: Validate store-ready packaging
        shell: pwsh
        run: |
          $requireProduction = $env:GITHUB_REF_TYPE -eq 'tag'
          .\scripts\validate-store-packaging.ps1 `
            -Target windows-x64 `
            -PackageVersion '${{ needs.resolve-version.outputs.version }}' `
            -RequireProduction:$requireProduction

      - name: Verify production release signatures
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          .\scripts\verify-release-signatures.ps1 `
            -Target windows-x64 `
            -RequireProduction `
            -ExpectedWindowsThumbprint $env:RICOCHET_WINDOWS_CERT_SHA1

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: ricochet-${{ needs.resolve-version.outputs.version }}-windows-x64
          path: |
            dist/*.zip
            dist/*-setup.exe
            dist/*.txt
            dist/*.json
          retention-days: 30

  package-linux:
    name: Package Linux release
    needs: resolve-version
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux GUI build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev

      - name: Import Linux GPG signing key
        if: github.ref_type == 'tag'
        shell: bash
        env:
          RICOCHET_LINUX_GPG_PRIVATE_KEY_BASE64: ${{ secrets.RICOCHET_LINUX_GPG_PRIVATE_KEY_BASE64 }}
          RICOCHET_LINUX_GPG_OWNERTRUST_BASE64: ${{ secrets.RICOCHET_LINUX_GPG_OWNERTRUST_BASE64 }}
          RICOCHET_LINUX_GPG_KEY: ${{ secrets.RICOCHET_LINUX_GPG_KEY }}
        run: |
          bash scripts/setup-linux-gpg-key.sh --required

      - name: Build release package
        shell: bash
        run: |
          version='${{ needs.resolve-version.outputs.version }}'
          signature_mode='dry-run'
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            signature_mode='require'
          elif [[ '${{ needs.resolve-version.outputs.is_nightly }}' == 'true' ]]; then
            signature_mode='auto'
          fi
          args=(--target linux-x64 --version "$version" --signature-mode "$signature_mode")
          bash scripts/package-release-linux.sh "${args[@]}"

      - name: Smoke-test package executable
        shell: bash
        run: |
          version='${{ needs.resolve-version.outputs.version }}'

          tmp="$(mktemp -d)"
          tar -xzf dist/ricochet-v*-linux-x64.tar.gz -C "$tmp"
          package_dir="$(find "$tmp" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -f "$package_dir/share/applications/ricochet-repl.desktop"
          grep -q 'Exec=rco repl' "$package_dir/share/applications/ricochet-repl.desktop"
          test -f "$package_dir/share/metainfo/today.ricochet.rco.metainfo.xml"
          test -f "$package_dir/share/icons/hicolor/scalable/apps/ricochet.svg"
          dpkg-deb --contents "dist/ricochet_${version}_amd64.deb" > "$tmp/ricochet-deb-contents.txt"
          grep -q 'usr/share/applications/ricochet-repl.desktop' "$tmp/ricochet-deb-contents.txt"
          grep -q 'usr/share/metainfo/today.ricochet.rco.metainfo.xml' "$tmp/ricochet-deb-contents.txt"
          "$package_dir/rco" package examples/basic-oop.rco \
            --output "$tmp/basic-oop" \
            --linux-package tar \
            --linux-package deb \
            --package-name basic-oop \
            --package-version "$version"
          "$tmp/basic-oop" > "$tmp/basic-oop.out"
          grep -q 'ada@example.com' "$tmp/basic-oop.out"
          test -f "$tmp/basic-oop-v${version}-linux-x64.tar.gz"
          test -f "$tmp/basic-oop_${version}_amd64.deb"
          dpkg-deb --info "$tmp/basic-oop_${version}_amd64.deb" > "$tmp/basic-oop-deb-info.txt"
          grep -q 'Package: basic-oop' "$tmp/basic-oop-deb-info.txt"

          "$package_dir/rco" package examples/webview_ui.rco \
            --gui \
            --output "$tmp/webview-ui" \
            --linux-package deb \
            --package-name webview-ui \
            --package-version "$version"
          RICOCHET_GUI_EXPORT_HTML="$tmp/webview-ui.html" "$tmp/webview-ui"
          grep -q '<title>Ricochet Desktop UI</title>' "$tmp/webview-ui.html"
          test -f "$tmp/webview-ui_${version}_amd64.deb"
          dpkg-deb --info "$tmp/webview-ui_${version}_amd64.deb" > "$tmp/webview-ui-deb-info.txt"
          grep -q 'Depends: libwebkit2gtk-4.1-0, libgtk-3-0' "$tmp/webview-ui-deb-info.txt"
          dpkg-deb --contents "$tmp/webview-ui_${version}_amd64.deb" > "$tmp/webview-ui-deb-contents.txt"
          grep -q 'usr/share/applications/webview-ui.desktop' "$tmp/webview-ui-deb-contents.txt"
          grep -q 'usr/share/metainfo/webview-ui.metainfo.xml' "$tmp/webview-ui-deb-contents.txt"

      - name: Validate release artifact manifest
        shell: pwsh
        run: |
          ./scripts/validate-release-artifacts.ps1 `
            -Target linux-x64 `
            -PackageVersion '${{ needs.resolve-version.outputs.version }}' `
            -RequireDeb

      - name: Validate store-ready packaging
        shell: pwsh
        run: |
          $requireProduction = $env:GITHUB_REF_TYPE -eq 'tag'
          ./scripts/validate-store-packaging.ps1 `
            -Target linux-x64 `
            -PackageVersion '${{ needs.resolve-version.outputs.version }}' `
            -RequireProduction:$requireProduction

      - name: Verify production release signatures
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          ./scripts/verify-release-signatures.ps1 `
            -Target linux-x64 `
            -RequireProduction `
            -GpgKey $env:RICOCHET_LINUX_GPG_KEY

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: ricochet-${{ needs.resolve-version.outputs.version }}-linux-x64
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.asc
            dist/*.txt
            dist/*.json
          retention-days: 30

  package-macos:
    name: Package macOS release (${{ matrix.target }})
    needs: resolve-version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-15
          - target: macos-x64
            runner: macos-15-intel

    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Prepare macOS signing keychain
        if: github.ref_type == 'tag'
        shell: bash
        env:
          RICOCHET_MACOS_CERT_P12_BASE64: ${{ secrets.RICOCHET_MACOS_CERT_P12_BASE64 }}
          RICOCHET_MACOS_CERT_PASSWORD: ${{ secrets.RICOCHET_MACOS_CERT_PASSWORD }}
          RICOCHET_MACOS_KEYCHAIN_PASSWORD: ${{ secrets.RICOCHET_MACOS_KEYCHAIN_PASSWORD }}
          RICOCHET_MACOS_SIGN_IDENTITY: ${{ secrets.RICOCHET_MACOS_SIGN_IDENTITY }}
          RICOCHET_MACOS_NOTARY_PROFILE: ${{ secrets.RICOCHET_MACOS_NOTARY_PROFILE }}
          RICOCHET_MACOS_NOTARY_APPLE_ID: ${{ secrets.RICOCHET_MACOS_NOTARY_APPLE_ID }}
          RICOCHET_MACOS_NOTARY_TEAM_ID: ${{ secrets.RICOCHET_MACOS_NOTARY_TEAM_ID }}
          RICOCHET_MACOS_NOTARY_PASSWORD: ${{ secrets.RICOCHET_MACOS_NOTARY_PASSWORD }}
          RICOCHET_MACOS_NOTARY_API_KEY_BASE64: ${{ secrets.RICOCHET_MACOS_NOTARY_API_KEY_BASE64 }}
          RICOCHET_MACOS_NOTARY_KEY_ID: ${{ secrets.RICOCHET_MACOS_NOTARY_KEY_ID }}
          RICOCHET_MACOS_NOTARY_ISSUER_ID: ${{ secrets.RICOCHET_MACOS_NOTARY_ISSUER_ID }}
        run: |
          bash scripts/setup-macos-signing-keychain.sh

      - name: Build release package
        shell: bash
        run: |
          version='${{ needs.resolve-version.outputs.version }}'
          signing_mode='dry-run'
          notarization_mode='dry-run'
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            signing_mode='require'
            notarization_mode='require'
          elif [[ '${{ needs.resolve-version.outputs.is_nightly }}' == 'true' ]]; then
            signing_mode='auto'
            notarization_mode='auto'
          fi
          args=(--target '${{ matrix.target }}' --version "$version" --signing-mode "$signing_mode" --notarization-mode "$notarization_mode")
          bash scripts/package-release-macos.sh "${args[@]}"

      - name: Cleanup macOS signing keychain
        if: always() && github.ref_type == 'tag'
        shell: bash
        run: |
          bash scripts/cleanup-macos-signing-keychain.sh

      - name: Smoke-test package executable
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          tar -xzf dist/ricochet-v*-${{ matrix.target }}.tar.gz -C "$tmp"
          package_dir="$(find "$tmp" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          "$package_dir/rco" package examples/basic-oop.rco --output "$tmp/basic-oop"
          "$tmp/basic-oop" | grep -q 'ada@example.com'
          "$package_dir/rco" package examples/webview_ui.rco --gui --output "$tmp/webview-ui"
          RICOCHET_GUI_EXPORT_HTML="$tmp/webview-ui.html" "$tmp/webview-ui"
          grep -q '<title>Ricochet Desktop UI</title>' "$tmp/webview-ui.html"

      - name: Validate release artifact manifest
        shell: pwsh
        run: |
          ./scripts/validate-release-artifacts.ps1 `
            -Target '${{ matrix.target }}' `
            -PackageVersion '${{ needs.resolve-version.outputs.version }}'

      - name: Validate store-ready packaging
        shell: pwsh
        run: |
          $requireProduction = $env:GITHUB_REF_TYPE -eq 'tag'
          ./scripts/validate-store-packaging.ps1 `
            -Target '${{ matrix.target }}' `
            -PackageVersion '${{ needs.resolve-version.outputs.version }}' `
            -RequireProduction:$requireProduction

      - name: Verify production release signatures
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          ./scripts/verify-release-signatures.ps1 `
            -Target '${{ matrix.target }}' `
            -RequireProduction `
            -ExpectedMacosIdentity $env:RICOCHET_MACOS_SIGN_IDENTITY

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: ricochet-${{ needs.resolve-version.outputs.version }}-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.txt
            dist/*.json
          retention-days: 30

  publish-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - resolve-version
      - package-windows
      - package-linux
      - package-macos
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Write update channel metadata
        shell: pwsh
        run: |
          ./scripts/write-update-channel.ps1 `
            -DistDir dist `
            -Channel '${{ needs.resolve-version.outputs.release_channel }}' `
            -Version '${{ needs.resolve-version.outputs.version }}' `
            -ReleaseTag $env:GITHUB_REF_NAME `
            -ReleaseUrl "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:GITHUB_REF_NAME"
          ./scripts/validate-update-channel.ps1 `
            -DistDir dist `
            -Channel '${{ needs.resolve-version.outputs.release_channel }}' `
            -Version '${{ needs.resolve-version.outputs.version }}' `
            -RequireProduction

      - name: Write checksums
        shell: bash
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -printf '%f\n' \
            | sort \
            | xargs sha256sum > SHA256SUMS.txt

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t assets < <(find dist -maxdepth 1 -type f | sort)
          release_flags=()
          if [[ '${{ needs.resolve-version.outputs.is_prerelease }}' == 'true' ]]; then
            release_flags+=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Ricochet $GITHUB_REF_NAME" \
            "${release_flags[@]}" \
            --notes "Windows, Linux, and macOS release packages for Ricochet $GITHUB_REF_NAME, including checksum, signing-status, artifact manifest, and update-channel reports."
