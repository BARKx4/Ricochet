name: Release

on:
  schedule:
    # Build nightly packages from main at 08:17 UTC.
    - cron: "17 8 * * *"
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package, without the leading v. Defaults to Cargo.toml."
        required: false
        type: string

permissions:
  contents: read

jobs:
  resolve-version:
    name: Resolve package version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_nightly: ${{ steps.version.outputs.is_nightly }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      release_channel: ${{ steps.version.outputs.release_channel }}
      artifact_suffix: ${{ steps.version.outputs.artifact_suffix }}

    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve package version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          workspace_version="$(awk -F '"' '/^\[workspace\.package\]/{found=1; next} found && /^[[:space:]]*version[[:space:]]*=/{print $2; exit}' Cargo.toml)"
          if [[ -z "$workspace_version" ]]; then
            echo "Could not resolve workspace.package version from Cargo.toml." >&2
            exit 1
          fi

          version="${REQUESTED_VERSION#v}"
          is_nightly=false
          is_prerelease=false
          release_channel=stable
          artifact_suffix=""

          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            version="$workspace_version"
            is_nightly=true
            artifact_suffix="-nightly.${GITHUB_RUN_NUMBER}"
          elif [[ -z "$version" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ -z "$version" ]]; then
            version="$workspace_version"
          fi

          if [[ -z "$version" ]]; then
            echo "Could not resolve a package version." >&2
            exit 1
          fi

          if [[ "$version" != "$workspace_version" ]]; then
            echo "Resolved package version '$version' does not match workspace Cargo version '$workspace_version'." >&2
            echo "Every package must use the exact compiled Cargo.toml version." >&2
            exit 1
          fi

          if [[ "$version" == *-* ]]; then
            is_prerelease=true
            release_channel=candidate
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "is_nightly=$is_nightly" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"
          echo "release_channel=$release_channel" >> "$GITHUB_OUTPUT"
          echo "artifact_suffix=$artifact_suffix" >> "$GITHUB_OUTPUT"
          {
            echo "### Ricochet package version"
            echo
            echo "- Version: \`$version\`"
            echo "- Workspace version: \`$workspace_version\`"
            echo "- Nightly: \`$is_nightly\`"
            echo "- Prerelease: \`$is_prerelease\`"
            echo "- Release channel: \`$release_channel\`"
          } >> "$GITHUB_STEP_SUMMARY"

  package-windows:
    name: Package Windows release
    needs: resolve-version
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install NSIS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidatePaths = @(
            (Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'),
            (Join-Path $env:ProgramFiles 'NSIS\makensis.exe')
          )

          $makensis = $candidatePaths | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          for ($attempt = 1; -not $makensis -and $attempt -le 3; $attempt++) {
            Write-Host "Installing NSIS with Chocolatey (attempt $attempt of 3)."
            choco install nsis -y --no-progress
            $makensis = $candidatePaths | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
            if (-not $makensis -and $attempt -lt 3) {
              Start-Sleep -Seconds (10 * $attempt)
            }
          }

          if (-not $makensis) {
            throw "NSIS makensis.exe was not found after installation attempts."
          }

          "NSIS_PATH=$makensis" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Using NSIS at $makensis"

      - name: Import Windows signing certificate
        if: github.ref_type == 'tag' && needs.resolve-version.outputs.is_prerelease != 'true'
        shell: pwsh
        env:
          RICOCHET_WINDOWS_CERT_PFX_BASE64: ${{ secrets.RICOCHET_WINDOWS_CERT_PFX_BASE64 }}
          RICOCHET_WINDOWS_CERT_PASSWORD: ${{ secrets.RICOCHET_WINDOWS_CERT_PASSWORD }}
          RICOCHET_WINDOWS_CERT_SHA1: ${{ secrets.RICOCHET_WINDOWS_CERT_SHA1 }}
        run: |
          .\scripts\setup-windows-signing-certificate.ps1 -Required

      - name: Build release package
        shell: pwsh
        env:
          RICOCHET_WINDOWS_TIMESTAMP_URL: ${{ vars.RICOCHET_WINDOWS_TIMESTAMP_URL }}
        run: |
          $version = '${{ needs.resolve-version.outputs.version }}'
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and '${{ needs.resolve-version.outputs.is_prerelease }}' -ne 'true') {
            $signingMode = 'require'
          } elseif ('${{ needs.resolve-version.outputs.is_nightly }}' -eq 'true') {
            $signingMode = 'auto'
          } else {
            $signingMode = 'dry-run'
          }
          .\scripts\package-release.ps1 -Version $version -Target windows-x64 -RequireInstaller -NsisPath $env:NSIS_PATH -SigningMode $signingMode

      - name: Smoke-test package executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ needs.resolve-version.outputs.version }}'
          $tmp = Join-Path $env:RUNNER_TEMP ("ricochet-windows-smoke-" + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $tmp | Out-Null

          $zip = Get-ChildItem -LiteralPath dist -Filter 'ricochet-v*-windows-x64.zip' | Select-Object -First 1
          if (-not $zip) {
            throw "Windows portable ZIP was not found in dist."
          }
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $tmp
          $rcoCandidates = @(Get-ChildItem -LiteralPath $tmp -Recurse -File -Filter 'rco.exe')
          if ($rcoCandidates.Count -ne 1) {
            throw "Expected exactly one rco.exe in the expanded Windows package, found $($rcoCandidates.Count)."
          }
          $rco = $rcoCandidates[0].FullName
          $packageDir = Split-Path -Parent $rco
          $packagedLicense = Join-Path $packageDir 'LICENSE'
          $repositoryLicense = Join-Path $env:GITHUB_WORKSPACE 'LICENSE'
          if (-not (Test-Path -LiteralPath $packagedLicense -PathType Leaf)) {
            throw "Windows portable ZIP did not contain LICENSE."
          }
          if ((Get-FileHash -LiteralPath $packagedLicense -Algorithm SHA256).Hash -cne (Get-FileHash -LiteralPath $repositoryLicense -Algorithm SHA256).Hash) {
            throw "Windows portable ZIP LICENSE did not match the repository license."
          }

          foreach ($noticeName in @(
            'THIRD_PARTY_LICENSES.html',
            'THIRD_PARTY_NOTICES.txt'
          )) {
            $repositoryNotice = Join-Path $env:GITHUB_WORKSPACE $noticeName
            $packagedNotice = Join-Path $packageDir $noticeName
            if (-not (Test-Path -LiteralPath $packagedNotice -PathType Leaf)) {
              throw "Windows portable ZIP did not contain $noticeName."
            }
            if ((Get-FileHash -LiteralPath $packagedNotice -Algorithm SHA256).Hash -cne (Get-FileHash -LiteralPath $repositoryNotice -Algorithm SHA256).Hash) {
              throw "Windows portable ZIP $noticeName did not match the repository snapshot."
            }
          }

          & .\docs\reference\validate.ps1 -Root (Join-Path $packageDir 'docs\reference') -PackageMode

          $basic = Join-Path $tmp 'basic-oop.exe'
          $basicSource = Join-Path $packageDir 'examples\basic-oop.rco'
          & $rco package $basicSource --output $basic --package-name basic-oop --package-version $version
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged rco failed to package basic-oop."
          }
          $basicOutput = & $basic
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged basic-oop executable failed."
          }
          if (($basicOutput -join "`n") -notmatch 'ada@example.com') {
            throw "Packaged basic-oop executable output did not contain ada@example.com."
          }

          $webview = Join-Path $tmp 'webview-ui.exe'
          $webviewSource = Join-Path $packageDir 'examples\webview_ui.rco'
          & $rco package $webviewSource --gui --output $webview --package-name webview-ui --package-version $version
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged rco failed to package webview-ui."
          }
          $env:RICOCHET_GUI_EXPORT_HTML = Join-Path $tmp 'webview-ui.html'
          $webviewProcess = Start-Process -FilePath $webview -Wait -PassThru
          if ($webviewProcess.ExitCode -ne 0) {
            throw "Packaged webview-ui executable failed with exit code $($webviewProcess.ExitCode)."
          }
          if (-not (Select-String -LiteralPath $env:RICOCHET_GUI_EXPORT_HTML -Pattern '<title>Ricochet Desktop UI</title>' -Quiet)) {
            throw "Packaged webview-ui HTML export did not contain the expected title."
          }

      - name: Smoke-test Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          if ([string]::IsNullOrWhiteSpace($env:RUNNER_TEMP)) {
            throw 'RUNNER_TEMP was not defined.'
          }

          $version = '${{ needs.resolve-version.outputs.version }}'
          $repoRoot = $env:GITHUB_WORKSPACE
          $distRoot = Join-Path $repoRoot 'dist'
          $installerCandidates = @(Get-ChildItem -LiteralPath $distRoot -File -Filter "ricochet-v$version-windows-x64-setup.exe")
          if ($installerCandidates.Count -ne 1) {
            throw "Expected exactly one versioned Windows installer, found $($installerCandidates.Count)."
          }
          $sourceCandidates = @(Get-ChildItem -LiteralPath $distRoot -Directory -Filter "ricochet-v$version-windows-x64")
          if ($sourceCandidates.Count -ne 1) {
            throw "Expected exactly one versioned Windows installer source directory, found $($sourceCandidates.Count)."
          }

          $installer = $installerCandidates[0].FullName
          $installerSource = $sourceCandidates[0].FullName
          $smokeRoot = Join-Path $env:RUNNER_TEMP ("ricochet-installer-smoke-" + [guid]::NewGuid().ToString('N'))
          $installDir = Join-Path $smokeRoot 'install'
          $foreignDir = Join-Path $smokeRoot 'foreign'
          $outsideDir = Join-Path $smokeRoot 'outside-checkout'
          $foreignSentinel = Join-Path $foreignDir 'foreign-destination-sentinel.txt'
          $userSentinel = Join-Path $installDir 'user-owned-sentinel.txt'
          $sentinelContents = 'preserve unrelated user data'
          if ($installDir -match '[\s"]') {
            throw "NSIS smoke install path contains whitespace or quotes: $installDir"
          }

          $programsFolder = [Environment]::GetFolderPath([Environment+SpecialFolder]::Programs)
          if ([string]::IsNullOrWhiteSpace($programsFolder)) {
            throw 'The current-user Start Menu Programs folder could not be resolved.'
          }
          $startMenuDir = Join-Path $programsFolder 'Ricochet'
          $uninstallKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Ricochet'

          function Assert-Leaf {
            param(
              [string] $Path,
              [string] $Label
            )

            if (-not (Test-Path -LiteralPath $Path -PathType Leaf)) {
              throw "$Label was missing: $Path"
            }
          }

          function Assert-Sha256Match {
            param(
              [string] $Expected,
              [string] $Actual,
              [string] $Label
            )

            Assert-Leaf -Path $Expected -Label "$Label source"
            Assert-Leaf -Path $Actual -Label "$Label packaged copy"
            $expectedHash = (Get-FileHash -LiteralPath $Expected -Algorithm SHA256).Hash
            $actualHash = (Get-FileHash -LiteralPath $Actual -Algorithm SHA256).Hash
            if ($actualHash -cne $expectedHash) {
              throw "$Label SHA-256 mismatch: expected $expectedHash, found $actualHash"
            }
          }

          function Assert-SamePath {
            param(
              [string] $Expected,
              [string] $Actual,
              [string] $Label
            )

            $expectedFull = [IO.Path]::GetFullPath($Expected)
            $actualFull = [IO.Path]::GetFullPath($Actual)
            if (-not [string]::Equals($expectedFull, $actualFull, [StringComparison]::OrdinalIgnoreCase)) {
              throw "$Label targeted '$actualFull'; expected '$expectedFull'."
            }
          }

          $legacyRc4Paths = @(
            'rco-app.exe',
            'packages\ricochet_slint\README.md',
            'packages\ricochet_slint\backend.rco',
            'packages\ricochet_slint\ricochet.toml',
            'packages\ricochet_slint\tests\SlintBackendPackageTest.rco',
            'packages\ricochet_ui\README.md',
            'packages\ricochet_ui\commands.rco',
            'packages\ricochet_ui\document.rco',
            'packages\ricochet_ui\events.rco',
            'packages\ricochet_ui\examples\counter_app.rco',
            'packages\ricochet_ui\examples\data_grid_viewer.rco',
            'packages\ricochet_ui\examples\native_showcase_app.rco',
            'packages\ricochet_ui\examples\project_tree_drag_drop.rco',
            'packages\ricochet_ui\examples\rich_text_note.rco',
            'packages\ricochet_ui\rich_text.rco',
            'packages\ricochet_ui\ricochet.toml',
            'packages\ricochet_ui\tests\UiDocumentPackageTest.rco',
            'packages\ricochet_ui\tests\UiInteractionPackageTest.rco',
            'packages\ricochet_ui\tests\UiValidationPackageTest.rco',
            'packages\ricochet_ui\validation.rco',
            'packages\ricochet_winui\README.md',
            'packages\ricochet_winui\backend.rco',
            'packages\ricochet_winui\ricochet.toml',
            'packages\ricochet_winui\tests\WinuiBackendPackageTest.rco'
          )

          foreach ($noticeName in @(
            'THIRD_PARTY_LICENSES.html',
            'THIRD_PARTY_NOTICES.txt'
          )) {
            Assert-Sha256Match `
              -Expected (Join-Path $repoRoot $noticeName) `
              -Actual (Join-Path $installerSource $noticeName) `
              -Label "Windows installer source $noticeName"
          }

          & .\docs\reference\validate.ps1 -Root (Join-Path $installerSource 'docs\reference') -PackageMode

          if (Test-Path -LiteralPath $uninstallKey) {
            throw 'Pre-existing Ricochet HKCU uninstall metadata would collide with the smoke test.'
          }
          if (Test-Path -LiteralPath $startMenuDir) {
            throw 'Pre-existing Ricochet Start Menu state would collide with the smoke test.'
          }

          New-Item -ItemType Directory -Path $smokeRoot | Out-Null
          New-Item -ItemType Directory -Path $outsideDir | Out-Null
          New-Item -ItemType Directory -Path $foreignDir | Out-Null
          Set-Content -LiteralPath $foreignSentinel -Value $sentinelContents -NoNewline

          $foreignProcess = Start-Process `
            -FilePath $installer `
            -ArgumentList "/S /D=$foreignDir" `
            -Wait `
            -PassThru
          if ($foreignProcess.ExitCode -eq 0) {
            throw 'Expected installer rejection for a foreign non-empty destination.'
          }
          if ((Get-Content -LiteralPath $foreignSentinel -Raw) -cne $sentinelContents) {
            throw 'Foreign destination sentinel was removed or changed.'
          }
          if (Test-Path -LiteralPath (Join-Path $foreignDir 'rco.exe')) {
            throw 'Rejected foreign destination received Ricochet files.'
          }

          New-Item -ItemType Directory -Path $installDir | Out-Null
          Set-Content -LiteralPath $userSentinel -Value $sentinelContents -NoNewline
          Set-Content -LiteralPath (Join-Path $installDir 'rco.exe') -Value 'legacy ownership fixture' -NoNewline
          foreach ($relativePath in $legacyRc4Paths) {
            $legacyPath = Join-Path $installDir $relativePath
            New-Item -ItemType Directory -Path (Split-Path -Parent $legacyPath) -Force | Out-Null
            Set-Content -LiteralPath $legacyPath -Value 'published rc.4 fixture' -NoNewline
          }
          New-Item -Path $uninstallKey -Force | Out-Null
          New-ItemProperty -LiteralPath $uninstallKey -Name DisplayName -Value 'Ricochet' -PropertyType String -Force | Out-Null
          New-ItemProperty -LiteralPath $uninstallKey -Name DisplayVersion -Value ('0.1.19-rc.' + '4') -PropertyType String -Force | Out-Null
          New-ItemProperty -LiteralPath $uninstallKey -Name InstallLocation -Value $installDir -PropertyType String -Force | Out-Null

          $installProcess = Start-Process `
            -FilePath $installer `
            -ArgumentList "/S /D=$installDir" `
            -Wait `
            -PassThru
          if ($installProcess.ExitCode -ne 0) {
            throw "Silent NSIS install failed with exit code $($installProcess.ExitCode)."
          }

          if ((Get-Content -LiteralPath $userSentinel -Raw) -cne $sentinelContents) {
            throw 'User-owned sentinel was removed or changed during upgrade.'
          }
          foreach ($relativePath in $legacyRc4Paths) {
            if (Test-Path -LiteralPath (Join-Path $installDir $relativePath)) {
              throw "Seeded legacy path survived the legacy cleanup upgrade: $relativePath"
            }
          }

          foreach ($relativePath in @(
            'rco.exe',
            'rco-gui.exe',
            'ricochet.exe',
            'Ricochet Shell.cmd',
            '.ricochet-install-owner',
            'Uninstall.exe',
            'LICENSE',
            'THIRD_PARTY_LICENSES.html',
            'THIRD_PARTY_NOTICES.txt',
            'examples\basic-oop.rco',
            'examples\webview_ui.rco',
            'docs\reference\index.html',
            'docs\learn\index.html'
          )) {
            Assert-Leaf -Path (Join-Path $installDir $relativePath) -Label "Installed $relativePath"
          }

          & .\docs\reference\validate.ps1 -Root (Join-Path $installDir 'docs\reference') -PackageMode

          foreach ($binaryName in @('rco.exe', 'ricochet.exe')) {
            $binary = Join-Path $installDir $binaryName
            $versionOutput = (@(& $binary --version 2>&1) -join "`n").Trim()
            $versionExitCode = $LASTEXITCODE
            if ($versionExitCode -ne 0) {
              throw "$binaryName --version failed with exit code $versionExitCode."
            }
            if ($versionOutput -cne "rco $version") {
              throw "$binaryName --version returned '$versionOutput'; expected 'rco $version'."
            }
          }

          foreach ($trackedFile in @(
            'LICENSE',
            'THIRD_PARTY_LICENSES.html',
            'THIRD_PARTY_NOTICES.txt'
          )) {
            Assert-Sha256Match `
              -Expected (Join-Path $repoRoot $trackedFile) `
              -Actual (Join-Path $installDir $trackedFile) `
              -Label "Installed $trackedFile"
          }

          $rco = Join-Path $installDir 'rco.exe'
          $webviewSource = Join-Path $installDir 'examples\webview_ui.rco'
          $webviewExecutable = Join-Path $outsideDir 'installed-webview.exe'
          $webviewHtml = Join-Path $outsideDir 'installed-webview.html'
          Push-Location -LiteralPath $outsideDir
          try {
            & $rco package $webviewSource `
              --gui `
              --output $webviewExecutable `
              --package-name installer-webview `
              --package-version $version
            if ($LASTEXITCODE -ne 0) {
              throw 'Installed rco failed to package the installed WebView example.'
            }
            Assert-Leaf -Path $webviewExecutable -Label 'Installed WebView package output'

            $previousExport = [Environment]::GetEnvironmentVariable('RICOCHET_GUI_EXPORT_HTML', 'Process')
            try {
              [Environment]::SetEnvironmentVariable('RICOCHET_GUI_EXPORT_HTML', $webviewHtml, 'Process')
              $webviewProcess = Start-Process `
                -FilePath $webviewExecutable `
                -WorkingDirectory $outsideDir `
                -Wait `
                -PassThru
            } finally {
              [Environment]::SetEnvironmentVariable('RICOCHET_GUI_EXPORT_HTML', $previousExport, 'Process')
            }

            if ($webviewProcess.ExitCode -ne 0) {
              throw "Installed WebView export failed with exit code $($webviewProcess.ExitCode)."
            }
            Assert-Leaf -Path $webviewHtml -Label 'Installed WebView HTML export'
            if (-not (Select-String -LiteralPath $webviewHtml -Pattern '<title>Ricochet Desktop UI</title>' -Quiet)) {
              throw 'Installed WebView HTML export did not contain the expected title.'
            }
          } finally {
            Pop-Location
          }

          if (-not (Test-Path -LiteralPath $uninstallKey)) {
            throw 'Installer did not create the HKCU Ricochet uninstall key.'
          }
          $registration = Get-ItemProperty -LiteralPath $uninstallKey
          foreach ($expected in ([ordered]@{
            DisplayName = 'Ricochet'
            DisplayVersion = $version
            Publisher = 'Ricochet'
            NoModify = 1
            NoRepair = 1
          }).GetEnumerator()) {
            $property = $registration.PSObject.Properties[$expected.Key]
            if ($null -eq $property) {
              throw "Uninstall metadata omitted $($expected.Key)."
            }
            if ([string]$property.Value -cne [string]$expected.Value) {
              throw "Uninstall metadata $($expected.Key) was '$($property.Value)'; expected '$($expected.Value)'."
            }
          }

          Assert-SamePath `
            -Expected $installDir `
            -Actual ([string]$registration.InstallLocation) `
            -Label 'Uninstall InstallLocation'
          $uninstaller = Join-Path $installDir 'Uninstall.exe'
          $expectedUninstallString = '"{0}"' -f $uninstaller
          if ([string]$registration.UninstallString -ne $expectedUninstallString) {
            throw "UninstallString was '$($registration.UninstallString)'; expected '$expectedUninstallString'."
          }

          $shortcutTargets = [ordered]@{
            'Ricochet Shell.lnk' = Join-Path $installDir 'Ricochet Shell.cmd'
            'Reference Docs.lnk' = Join-Path $installDir 'docs\reference\index.html'
            'Third-Party Licenses.lnk' = Join-Path $installDir 'THIRD_PARTY_LICENSES.html'
            'Uninstall Ricochet.lnk' = $uninstaller
          }
          $shell = $null
          try {
            $shell = New-Object -ComObject WScript.Shell
            foreach ($shortcutEntry in $shortcutTargets.GetEnumerator()) {
              $shortcutPath = Join-Path $startMenuDir $shortcutEntry.Key
              Assert-Leaf -Path $shortcutPath -Label "Start Menu shortcut $($shortcutEntry.Key)"
              $shortcut = $null
              try {
                $shortcut = $shell.CreateShortcut($shortcutPath)
                $shortcutTarget = [string]$shortcut.TargetPath
              } finally {
                if ($null -ne $shortcut) {
                  [void][Runtime.InteropServices.Marshal]::FinalReleaseComObject($shortcut)
                }
              }
              Assert-SamePath `
                -Expected $shortcutEntry.Value `
                -Actual $shortcutTarget `
                -Label "Start Menu shortcut $($shortcutEntry.Key)"
            }
          } finally {
            if ($null -ne $shell) {
              [void][Runtime.InteropServices.Marshal]::FinalReleaseComObject($shell)
            }
          }

          $uninstallProcess = Start-Process `
            -FilePath $uninstaller `
            -ArgumentList '/S' `
            -Wait `
            -PassThru
          $uninstallStubExitCode = $uninstallProcess.ExitCode

          $installerOwnedPaths = @(
            'rco.exe',
            'rco-gui.exe',
            'ricochet.exe',
            'Ricochet Shell.cmd',
            '.ricochet-install-owner',
            'Uninstall.exe',
            'LICENSE',
            'THIRD_PARTY_LICENSES.html',
            'THIRD_PARTY_NOTICES.txt',
            'examples\basic-oop.rco',
            'examples\webview_ui.rco',
            'docs\reference\index.html',
            'docs\learn\index.html'
          )
          $deadline = [DateTime]::UtcNow.AddSeconds(30)
          do {
            $remainingOwnedPaths = @($installerOwnedPaths | Where-Object { Test-Path -LiteralPath (Join-Path $installDir $_) })
            $sentinelPreserved = (Test-Path -LiteralPath $userSentinel -PathType Leaf) -and ((Get-Content -LiteralPath $userSentinel -Raw) -ceq $sentinelContents)
            $registryRemoved = -not (Test-Path -LiteralPath $uninstallKey)
            $shortcutsRemoved = -not (Test-Path -LiteralPath $startMenuDir)
            if ($remainingOwnedPaths.Count -eq 0 -and $sentinelPreserved -and $registryRemoved -and $shortcutsRemoved) {
              break
            }
            Start-Sleep -Milliseconds 250
          } while ([DateTime]::UtcNow -lt $deadline)

          $remaining = @()
          foreach ($relativePath in $remainingOwnedPaths) {
            $remaining += "Installer-owned path survived uninstall: $relativePath"
          }
          if (-not $sentinelPreserved) {
            $remaining += 'User-owned sentinel was removed or changed'
          }
          if (Test-Path -LiteralPath $uninstallKey) {
            $remaining += "registry key '$uninstallKey'"
          }
          if (Test-Path -LiteralPath $startMenuDir) {
            $remaining += "Start Menu directory '$startMenuDir'"
          }
          if ($remaining.Count -ne 0) {
            throw "Silent uninstall left state behind: $($remaining -join '; '). Stub exit code: $uninstallStubExitCode."
          }
          if ($uninstallStubExitCode -ne 0) {
            throw "NSIS uninstaller stub returned exit code $uninstallStubExitCode even though installer-owned state was removed."
          }

      - name: Validate release artifact manifest
        shell: pwsh
        run: |
          .\scripts\validate-release-artifacts.ps1 `
            -Target windows-x64 `
            -PackageVersion '${{ needs.resolve-version.outputs.version }}' `
            -RequireInstaller

      - name: Validate store-ready packaging
        shell: pwsh
        run: |
          $requireProduction = $env:GITHUB_REF_TYPE -eq 'tag' -and '${{ needs.resolve-version.outputs.is_prerelease }}' -ne 'true'
          .\scripts\validate-store-packaging.ps1 `
            -Target windows-x64 `
            -PackageVersion '${{ needs.resolve-version.outputs.version }}' `
            -RequireProduction:$requireProduction

      - name: Verify production release signatures
        if: github.ref_type == 'tag' && needs.resolve-version.outputs.is_prerelease != 'true'
        shell: pwsh
        run: |
          .\scripts\verify-release-signatures.ps1 `
            -Target windows-x64 `
            -RequireProduction `
            -ExpectedWindowsThumbprint $env:RICOCHET_WINDOWS_CERT_SHA1

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: ricochet-${{ needs.resolve-version.outputs.version }}${{ needs.resolve-version.outputs.artifact_suffix }}-windows-x64
          path: |
            dist/*.zip
            dist/*-setup.exe
            dist/*.txt
            dist/*.json
          retention-days: 30

  package-linux:
    name: Package Linux release
    needs: resolve-version
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Test Linux release version guard
        shell: bash
        run: bash scripts/test-linux-release-version.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux GUI build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev

      - name: Import Linux GPG signing key
        if: github.ref_type == 'tag' && needs.resolve-version.outputs.is_prerelease != 'true'
        shell: bash
        env:
          RICOCHET_LINUX_GPG_PRIVATE_KEY_BASE64: ${{ secrets.RICOCHET_LINUX_GPG_PRIVATE_KEY_BASE64 }}
          RICOCHET_LINUX_GPG_OWNERTRUST_BASE64: ${{ secrets.RICOCHET_LINUX_GPG_OWNERTRUST_BASE64 }}
          RICOCHET_LINUX_GPG_KEY: ${{ secrets.RICOCHET_LINUX_GPG_KEY }}
        run: |
          bash scripts/setup-linux-gpg-key.sh --required

      - name: Build release package
        shell: bash
        run: |
          version='${{ needs.resolve-version.outputs.version }}'
          signature_mode='dry-run'
          if [[ "$GITHUB_REF_TYPE" == "tag" && '${{ needs.resolve-version.outputs.is_prerelease }}' != "true" ]]; then
            signature_mode='require'
          elif [[ '${{ needs.resolve-version.outputs.is_nightly }}' == 'true' ]]; then
            signature_mode='auto'
          fi
          args=(--target linux-x64 --version "$version" --signature-mode "$signature_mode")
          bash scripts/package-release-linux.sh "${args[@]}"

      - name: Smoke-test package executable
        shell: bash
        run: |
          version='${{ needs.resolve-version.outputs.version }}'
          semver_to_debian_version() {
            local semver="$1"
            local precedence="$semver"
            local build=""
            if [[ "$precedence" == *+* ]]; then
              build="+${precedence#*+}"
              precedence="${precedence%%+*}"
            fi
            if [[ "$precedence" == *-* ]]; then
              printf '%s~%s%s\n' "${precedence%%-*}" "${precedence#*-}" "$build"
            else
              printf '%s%s\n' "$precedence" "$build"
            fi
          }
          debian_version_to_release_asset_version() {
            local debian_version="$1"
            printf '%s\n' "$debian_version" | LC_ALL=C sed -E 's/[^A-Za-z0-9._-]/./g'
          }
          debian_version="$(semver_to_debian_version "$version")"
          release_asset_version="$(debian_version_to_release_asset_version "$debian_version")"
          official_deb="dist/ricochet_${release_asset_version}_amd64.deb"

          tmp="$(mktemp -d)"
          tar -xzf dist/ricochet-v*-linux-x64.tar.gz -C "$tmp"
          package_dir="$(find "$tmp" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -f "$package_dir/LICENSE"
          cmp LICENSE "$package_dir/LICENSE"
          test -f "$package_dir/share/applications/ricochet-repl.desktop"
          grep -q 'Exec=rco repl' "$package_dir/share/applications/ricochet-repl.desktop"
          test -f "$package_dir/share/metainfo/today.ricochet.rco.metainfo.xml"
          grep -q '<project_license>Apache-2.0</project_license>' "$package_dir/share/metainfo/today.ricochet.rco.metainfo.xml"
          test -f "$package_dir/share/icons/hicolor/scalable/apps/ricochet.svg"
          for binary in rco rco-gui ricochet; do
            readelf -d "$package_dir/$binary" | grep -q 'Shared library: \[libxdo\.so\.3\]'
          done
          dpkg-deb --contents "$official_deb" > "$tmp/ricochet-deb-contents.txt"
          grep -q 'usr/share/applications/ricochet-repl.desktop' "$tmp/ricochet-deb-contents.txt"
          grep -q 'usr/share/metainfo/today.ricochet.rco.metainfo.xml' "$tmp/ricochet-deb-contents.txt"
          grep -q 'usr/share/doc/ricochet/LICENSE' "$tmp/ricochet-deb-contents.txt"
          package_debian_version="$(dpkg-deb --field "$official_deb" Version)"
          test "$package_debian_version" = "$debian_version"
          if [[ "$version" == *-* ]]; then
            stable_version="${version%%-*}"
            dpkg --compare-versions "$package_debian_version" lt "$stable_version"
          fi
          dpkg-deb --extract "$official_deb" "$tmp/deb-root"
          cmp LICENSE "$tmp/deb-root/usr/share/doc/ricochet/LICENSE"
          pwsh -NoProfile -File ./docs/reference/validate.ps1 -Root "$package_dir/docs/reference" -PackageMode
          pwsh -NoProfile -File ./docs/reference/validate.ps1 -Root "$tmp/deb-root/usr/share/doc/ricochet/reference" -PackageMode

          notice_hash() {
            sha256sum "$1" | awk '{ print $1 }'
          }
          for notice in THIRD_PARTY_LICENSES.html THIRD_PARTY_NOTICES.txt; do
            tar_notice="$package_dir/$notice"
            deb_notice="$tmp/deb-root/usr/share/doc/ricochet/$notice"
            test -f "$tar_notice"
            test -f "$deb_notice"
            repository_hash="$(notice_hash "$notice")"
            tar_hash="$(notice_hash "$tar_notice")"
            deb_hash="$(notice_hash "$deb_notice")"
            if [[ "$tar_hash" != "$repository_hash" ]]; then
              echo "Linux tar $notice hash mismatch: expected $repository_hash, found $tar_hash" >&2
              exit 1
            fi
            if [[ "$deb_hash" != "$repository_hash" ]]; then
              echo "Debian $notice hash mismatch: expected $repository_hash, found $deb_hash" >&2
              exit 1
            fi
          done

          "$package_dir/rco" package examples/basic-oop.rco \
            --output "$tmp/basic-oop" \
            --linux-package tar \
            --linux-package deb \
            --package-name basic-oop \
            --package-version "$version"
          "$tmp/basic-oop" > "$tmp/basic-oop.out"
          grep -q 'ada@example.com' "$tmp/basic-oop.out"
          readelf -d "$tmp/basic-oop" | grep -q 'Shared library: \[libxdo\.so\.3\]'
          test -f "$tmp/basic-oop-v${version}-linux-x64.tar.gz"
          test -f "$tmp/basic-oop_${debian_version}_amd64.deb"
          dpkg-deb --info "$tmp/basic-oop_${debian_version}_amd64.deb" > "$tmp/basic-oop-deb-info.txt"
          grep -q 'Package: basic-oop' "$tmp/basic-oop-deb-info.txt"
          grep -q 'Depends: libgtk-3-0, libwebkit2gtk-4.1-0, libxdo3' "$tmp/basic-oop-deb-info.txt"

          "$package_dir/rco" package examples/webview_ui.rco \
            --gui \
            --output "$tmp/webview-ui" \
            --linux-package deb \
            --package-name webview-ui \
            --package-version "$version" \
            --package-license Apache-2.0
          RICOCHET_GUI_EXPORT_HTML="$tmp/webview-ui.html" "$tmp/webview-ui"
          grep -q '<title>Ricochet Desktop UI</title>' "$tmp/webview-ui.html"
          readelf -d "$tmp/webview-ui" | grep -q 'Shared library: \[libxdo\.so\.3\]'
          test -f "$tmp/webview-ui_${debian_version}_amd64.deb"
          dpkg-deb --info "$tmp/webview-ui_${debian_version}_amd64.deb" > "$tmp/webview-ui-deb-info.txt"
          grep -q 'Depends: libgtk-3-0, libwebkit2gtk-4.1-0, libxdo3' "$tmp/webview-ui-deb-info.txt"
          dpkg-deb --contents "$tmp/webview-ui_${debian_version}_amd64.deb" > "$tmp/webview-ui-deb-contents.txt"
          grep -q 'usr/share/applications/webview-ui.desktop' "$tmp/webview-ui-deb-contents.txt"
          grep -q 'usr/share/metainfo/webview-ui.metainfo.xml' "$tmp/webview-ui-deb-contents.txt"

      - name: Validate release artifact manifest
        shell: pwsh
        run: |
          ./scripts/validate-release-artifacts.ps1 `
            -Target linux-x64 `
            -PackageVersion '${{ needs.resolve-version.outputs.version }}' `
            -RequireDeb

      - name: Validate store-ready packaging
        shell: pwsh
        run: |
          $requireProduction = $env:GITHUB_REF_TYPE -eq 'tag' -and '${{ needs.resolve-version.outputs.is_prerelease }}' -ne 'true'
          ./scripts/validate-store-packaging.ps1 `
            -Target linux-x64 `
            -PackageVersion '${{ needs.resolve-version.outputs.version }}' `
            -RequireProduction:$requireProduction

      - name: Verify production release signatures
        if: github.ref_type == 'tag' && needs.resolve-version.outputs.is_prerelease != 'true'
        shell: pwsh
        run: |
          ./scripts/verify-release-signatures.ps1 `
            -Target linux-x64 `
            -RequireProduction `
            -GpgKey $env:RICOCHET_LINUX_GPG_KEY

      - name: Cleanup Linux GPG signing key
        if: always() && github.ref_type == 'tag' && needs.resolve-version.outputs.is_prerelease != 'true'
        shell: bash
        run: |
          bash scripts/cleanup-linux-gpg-key.sh

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: ricochet-${{ needs.resolve-version.outputs.version }}${{ needs.resolve-version.outputs.artifact_suffix }}-linux-x64
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.asc
            dist/*.txt
            dist/*.json
          retention-days: 30

  package-macos:
    name: Package macOS release (${{ matrix.target }})
    needs: resolve-version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-15
          - target: macos-x64
            runner: macos-15-intel

    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Prepare macOS signing keychain
        if: github.ref_type == 'tag' && needs.resolve-version.outputs.is_prerelease != 'true'
        shell: bash
        env:
          RICOCHET_MACOS_CERT_P12_BASE64: ${{ secrets.RICOCHET_MACOS_CERT_P12_BASE64 }}
          RICOCHET_MACOS_CERT_PASSWORD: ${{ secrets.RICOCHET_MACOS_CERT_PASSWORD }}
          RICOCHET_MACOS_KEYCHAIN_PASSWORD: ${{ secrets.RICOCHET_MACOS_KEYCHAIN_PASSWORD }}
          RICOCHET_MACOS_SIGN_IDENTITY: ${{ secrets.RICOCHET_MACOS_SIGN_IDENTITY }}
          RICOCHET_MACOS_NOTARY_PROFILE: ${{ secrets.RICOCHET_MACOS_NOTARY_PROFILE }}
          RICOCHET_MACOS_NOTARY_APPLE_ID: ${{ secrets.RICOCHET_MACOS_NOTARY_APPLE_ID }}
          RICOCHET_MACOS_NOTARY_TEAM_ID: ${{ secrets.RICOCHET_MACOS_NOTARY_TEAM_ID }}
          RICOCHET_MACOS_NOTARY_PASSWORD: ${{ secrets.RICOCHET_MACOS_NOTARY_PASSWORD }}
          RICOCHET_MACOS_NOTARY_API_KEY_BASE64: ${{ secrets.RICOCHET_MACOS_NOTARY_API_KEY_BASE64 }}
          RICOCHET_MACOS_NOTARY_KEY_ID: ${{ secrets.RICOCHET_MACOS_NOTARY_KEY_ID }}
          RICOCHET_MACOS_NOTARY_ISSUER_ID: ${{ secrets.RICOCHET_MACOS_NOTARY_ISSUER_ID }}
        run: |
          bash scripts/setup-macos-signing-keychain.sh

      - name: Build release package
        shell: bash
        run: |
          version='${{ needs.resolve-version.outputs.version }}'
          signing_mode='dry-run'
          notarization_mode='dry-run'
          if [[ "$GITHUB_REF_TYPE" == "tag" && '${{ needs.resolve-version.outputs.is_prerelease }}' != "true" ]]; then
            signing_mode='require'
            notarization_mode='require'
          elif [[ '${{ needs.resolve-version.outputs.is_nightly }}' == 'true' ]]; then
            signing_mode='auto'
            notarization_mode='auto'
          fi
          args=(--target '${{ matrix.target }}' --version "$version" --signing-mode "$signing_mode" --notarization-mode "$notarization_mode")
          bash scripts/package-release-macos.sh "${args[@]}"

      - name: Cleanup macOS signing keychain
        if: always() && github.ref_type == 'tag' && needs.resolve-version.outputs.is_prerelease != 'true'
        shell: bash
        run: |
          bash scripts/cleanup-macos-signing-keychain.sh

      - name: Smoke-test package executable
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          tar -xzf dist/ricochet-v*-${{ matrix.target }}.tar.gz -C "$tmp"
          package_dir="$(find "$tmp" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          cmp LICENSE "$package_dir/LICENSE"
          pwsh -NoProfile -File ./docs/reference/validate.ps1 -Root "$package_dir/docs/reference" -PackageMode

          notice_hash() {
            shasum -a 256 "$1" | awk '{ print $1 }'
          }
          for notice in THIRD_PARTY_LICENSES.html THIRD_PARTY_NOTICES.txt; do
            packaged_notice="$package_dir/$notice"
            test -f "$packaged_notice"
            repository_hash="$(notice_hash "$notice")"
            packaged_hash="$(notice_hash "$packaged_notice")"
            if [[ "$packaged_hash" != "$repository_hash" ]]; then
              echo "${{ matrix.target }} $notice hash mismatch: expected $repository_hash, found $packaged_hash" >&2
              exit 1
            fi
          done

          "$package_dir/rco" package examples/basic-oop.rco --output "$tmp/basic-oop"
          "$tmp/basic-oop" | grep -q 'ada@example.com'
          "$package_dir/rco" package examples/webview_ui.rco --gui --output "$tmp/webview-ui"
          RICOCHET_GUI_EXPORT_HTML="$tmp/webview-ui.html" "$tmp/webview-ui"
          grep -q '<title>Ricochet Desktop UI</title>' "$tmp/webview-ui.html"

      - name: Validate release artifact manifest
        shell: pwsh
        run: |
          ./scripts/validate-release-artifacts.ps1 `
            -Target '${{ matrix.target }}' `
            -PackageVersion '${{ needs.resolve-version.outputs.version }}'

      - name: Validate store-ready packaging
        shell: pwsh
        run: |
          $requireProduction = $env:GITHUB_REF_TYPE -eq 'tag' -and '${{ needs.resolve-version.outputs.is_prerelease }}' -ne 'true'
          ./scripts/validate-store-packaging.ps1 `
            -Target '${{ matrix.target }}' `
            -PackageVersion '${{ needs.resolve-version.outputs.version }}' `
            -RequireProduction:$requireProduction

      - name: Verify production release signatures
        if: github.ref_type == 'tag' && needs.resolve-version.outputs.is_prerelease != 'true'
        shell: pwsh
        run: |
          ./scripts/verify-release-signatures.ps1 `
            -Target '${{ matrix.target }}' `
            -RequireProduction `
            -ExpectedMacosIdentity $env:RICOCHET_MACOS_SIGN_IDENTITY

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: ricochet-${{ needs.resolve-version.outputs.version }}${{ needs.resolve-version.outputs.artifact_suffix }}-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.txt
            dist/*.json
          retention-days: 30

  smoke-linux-deb:
    name: Smoke-test Debian runtime install
    needs:
      - resolve-version
      - package-linux
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04

    steps:
      - name: Download Linux package artifact
        uses: actions/download-artifact@v8
        with:
          name: ricochet-${{ needs.resolve-version.outputs.version }}${{ needs.resolve-version.outputs.artifact_suffix }}-linux-x64
          path: dist

      - name: Install and smoke-test Debian package
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.resolve-version.outputs.version }}'
          shopt -s nullglob
          deb_candidates=(dist/*.deb)
          if [[ ${#deb_candidates[@]} -ne 1 ]]; then
            echo "Expected exactly one Debian package, found ${#deb_candidates[@]}." >&2
            exit 1
          fi
          deb="$(realpath "${deb_candidates[0]}")"

          apt-get update
          apt-get install -y --no-install-recommends "$deb"

          for binary in /usr/bin/rco /usr/bin/rco-gui /usr/bin/ricochet; do
            ldd_report="/tmp/$(basename "$binary")-ldd.txt"
            ldd "$binary" > "$ldd_report"
            if grep -Fq 'not found' "$ldd_report"; then
              cat "$ldd_report" >&2
              exit 1
            fi
          done

          [[ "$(rco --version)" == "rco $version" ]]
          [[ "$(ricochet --version)" == "rco $version" ]]
          rco run /usr/share/ricochet/examples/basic-oop.rco
          webview_export="/tmp/ricochet-webview-export-${GITHUB_RUN_ID}.html"
          RICOCHET_GUI_EXPORT_HTML="$webview_export" rco gui /usr/share/ricochet/examples/webview_ui.rco
          grep -Fq '<title>Ricochet Desktop UI</title>' "$webview_export"

  publish-release:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    needs:
      - resolve-version
      - package-windows
      - package-linux
      - package-macos
      - smoke-linux-deb
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Write update channel metadata
        shell: pwsh
        run: |
          ./scripts/write-update-channel.ps1 `
            -DistDir dist `
            -Channel '${{ needs.resolve-version.outputs.release_channel }}' `
            -Version '${{ needs.resolve-version.outputs.version }}' `
            -ReleaseTag $env:GITHUB_REF_NAME `
            -ReleaseUrl "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:GITHUB_REF_NAME"
          ./scripts/validate-update-channel.ps1 `
            -DistDir dist `
            -Channel '${{ needs.resolve-version.outputs.release_channel }}' `
            -Version '${{ needs.resolve-version.outputs.version }}' `
            -RequireProduction:('${{ needs.resolve-version.outputs.is_prerelease }}' -ne 'true')

      - name: Write checksums
        shell: bash
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -printf '%f\n' \
            | sort \
            | xargs sha256sum > SHA256SUMS.txt

      - name: Revalidate finalized update channel
        shell: pwsh
        run: |
          ./scripts/validate-update-channel.ps1 `
            -DistDir dist `
            -Channel '${{ needs.resolve-version.outputs.release_channel }}' `
            -Version '${{ needs.resolve-version.outputs.version }}' `
            -RequireProduction:('${{ needs.resolve-version.outputs.is_prerelease }}' -ne 'true')

      - name: Create draft GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t assets < <(find dist -maxdepth 1 -type f | sort)
          release_flags=(--draft)
          if [[ '${{ needs.resolve-version.outputs.is_prerelease }}' == 'true' ]]; then
            release_flags+=(--prerelease --latest=false)
          fi
          remote_tag_commit="$(
            git ls-remote origin "refs/tags/$GITHUB_REF_NAME^{}" \
              | awk 'NR == 1 { print $1 }'
          )"
          if [[ "$remote_tag_commit" != "$GITHUB_SHA" ]]; then
            echo "Remote tag $GITHUB_REF_NAME peels to ${remote_tag_commit:-<missing>}, expected workflow commit $GITHUB_SHA." >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Ricochet $GITHUB_REF_NAME" \
            "${release_flags[@]}" \
            --notes "Windows, Linux, and macOS release packages for Ricochet $GITHUB_REF_NAME, including checksum, signing-status, artifact manifest, and update-channel reports."

      - name: Audit draft GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseJson = Join-Path $env:RUNNER_TEMP "ricochet-release-$env:GITHUB_RUN_ID-draft.json"
          $maxDraftLookupAttempts = 10
          $releaseMatches = @()
          for ($attempt = 1; $attempt -le $maxDraftLookupAttempts; $attempt++) {
            $releaseListJson = gh api --paginate --slurp "repos/$env:GITHUB_REPOSITORY/releases?per_page=100"
            if ($LASTEXITCODE -ne 0) {
              throw "Could not list draft GitHub releases."
            }
            $releaseCandidates = @($releaseListJson | ConvertFrom-Json | ForEach-Object { $_ })
            $releaseMatches = @(
              $releaseCandidates | Where-Object {
                [string]$_.tag_name -ceq $env:GITHUB_REF_NAME -and [bool]$_.draft
              }
            )
            if ($releaseMatches.Count -eq 1) {
              break
            }
            if ($releaseMatches.Count -gt 1) {
              throw "Expected exactly one draft for $env:GITHUB_REF_NAME; found $($releaseMatches.Count)."
            }
            if ($attempt -lt $maxDraftLookupAttempts) {
              Start-Sleep -Seconds 2
            }
          }
          if ($releaseMatches.Count -ne 1) {
            throw "Expected exactly one draft for $env:GITHUB_REF_NAME; found $($releaseMatches.Count)."
          }
          $release = $releaseMatches[0]
          $release | ConvertTo-Json -Depth 100 | Set-Content -LiteralPath $releaseJson -Encoding utf8
          ./scripts/validate-published-release-assets.ps1 `
            -ReleaseJsonPath $releaseJson `
            -AssetDir dist `
            -ExpectedTag $env:GITHUB_REF_NAME `
            -RequireDraft `
            -RequirePrerelease:('${{ needs.resolve-version.outputs.is_prerelease }}' -eq 'true') `
            -RequireStable:('${{ needs.resolve-version.outputs.is_prerelease }}' -ne 'true')

          $downloadDir = Join-Path $env:RUNNER_TEMP "ricochet-release-$env:GITHUB_RUN_ID-download"
          New-Item -ItemType Directory -Path $downloadDir | Out-Null
          $ProgressPreference = "SilentlyContinue"
          $headers = @{
            Accept = "application/octet-stream"
            Authorization = "Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          foreach ($asset in @($release.assets)) {
            $destination = Join-Path $downloadDir ([string]$asset.name)
            Invoke-WebRequest `
              -Uri ([string]$asset.url) `
              -Headers $headers `
              -OutFile $destination `
              -MaximumRedirection 5
          }
          ./scripts/validate-published-release-assets.ps1 `
            -ReleaseJsonPath $releaseJson `
            -AssetDir $downloadDir `
            -ExpectedTag $env:GITHUB_REF_NAME `
            -RequireDraft `
            -RequirePrerelease:('${{ needs.resolve-version.outputs.is_prerelease }}' -eq 'true') `
            -RequireStable:('${{ needs.resolve-version.outputs.is_prerelease }}' -ne 'true')
          ./scripts/validate-update-channel.ps1 `
            -DistDir $downloadDir `
            -Channel '${{ needs.resolve-version.outputs.release_channel }}' `
            -Version '${{ needs.resolve-version.outputs.version }}' `
            -RequireProduction:('${{ needs.resolve-version.outputs.is_prerelease }}' -ne 'true')

      - name: Publish audited GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=(--draft=false)
          if [[ '${{ needs.resolve-version.outputs.is_prerelease }}' == 'true' ]]; then
            release_flags+=(--prerelease --latest=false)
          else
            release_flags+=(--latest)
          fi
          remote_tag_commit="$(
            git ls-remote origin "refs/tags/$GITHUB_REF_NAME^{}" \
              | awk 'NR == 1 { print $1 }'
          )"
          if [[ "$remote_tag_commit" != "$GITHUB_SHA" ]]; then
            echo "Remote tag $GITHUB_REF_NAME peels to ${remote_tag_commit:-<missing>}, expected workflow commit $GITHUB_SHA." >&2
            exit 1
          fi
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            "${release_flags[@]}"

      - name: Verify published GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseJson = Join-Path $env:RUNNER_TEMP "ricochet-release-$env:GITHUB_RUN_ID-published.json"
          gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:GITHUB_REF_NAME" | Set-Content -LiteralPath $releaseJson -Encoding utf8
          if ($LASTEXITCODE -ne 0) {
            throw "Could not query the published GitHub release."
          }
          ./scripts/validate-published-release-assets.ps1 `
            -ReleaseJsonPath $releaseJson `
            -AssetDir dist `
            -ExpectedTag $env:GITHUB_REF_NAME `
            -RequirePublished `
            -RequirePrerelease:('${{ needs.resolve-version.outputs.is_prerelease }}' -eq 'true') `
            -RequireStable:('${{ needs.resolve-version.outputs.is_prerelease }}' -ne 'true')
