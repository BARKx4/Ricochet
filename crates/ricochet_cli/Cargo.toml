[package]
name = "ricochet_cli"
edition.workspace = true
version.workspace = true
license.workspace = true
autobins = false

[[bin]]
name = "rco"
path = "src/bin/rco.rs"

[[bin]]
name = "ricochet"
path = "src/bin/ricochet.rs"

[[bin]]
name = "rco-gui"
path = "src/bin/rco_gui.rs"

[[bin]]
name = "rco-app"
path = "src/bin/rco_app.rs"

[dependencies]
ricochet_bytecode = { path = "../ricochet_bytecode" }
ricochet_compiler = { path = "../ricochet_compiler" }
ricochet_syntax = { path = "../ricochet_syntax" }
ricochet_vm = { path = "../ricochet_vm" }
ricochet_web = { path = "../ricochet_web" }
anyhow.workspace = true
axum = { workspace = true, features = ["multipart"] }
bytes.workspace = true
chrono.workspace = true
clap.workspace = true
flate2.workspace = true
getrandom.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
sha2.workspace = true
tar.workspace = true
tempfile.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
toml.workspace = true
toml_edit.workspace = true
tower.workspace = true

[dev-dependencies]
tungstenite.workspace = true

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
winit = "0.30"
wry = { version = "0.55", default-features = false }
