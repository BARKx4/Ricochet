[package]
name = "ricochet_vm"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
default = []
test-host = ["ricochet_secrets/test-host"]

[dependencies]
ricochet_application = { path = "../ricochet_application" }
ricochet_bytecode = { path = "../ricochet_bytecode" }
ricochet_sandbox = { path = "../ricochet_sandbox" }
ricochet_secrets = { path = "../ricochet_secrets" }
argon2.workspace = true
arboard.workspace = true
base64.workspace = true
chrono.workspace = true
crossterm.workspace = true
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
reqwest.workspace = true
regex.workspace = true
rfd.workspace = true
thiserror.workspace = true
tungstenite.workspace = true
wait-timeout.workspace = true
portable-pty.workspace = true
tempfile.workspace = true

[dev-dependencies]
h2 = "0.4"
ricochet_compiler = { path = "../ricochet_compiler" }
ricochet_secrets = { path = "../ricochet_secrets", features = ["test-host"] }
rcgen = "0.13.2"
rustls.workspace = true
tokio.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
zeroize.workspace = true
