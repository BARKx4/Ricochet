[advisories]
# Accepted while the Linux GUI stack depends on GTK3 via WebKitGTK/Wry.
ignore = [
  "RUSTSEC-2024-0370", # proc-macro-error: transitive gtk3-macros dependency
  "RUSTSEC-2024-0429", # glib: transitive GTK3 stack dependency
  "RUSTSEC-2026-0194", # quick-xml: transitive wayland-scanner build-time dependency; latest wayland-scanner still pins quick-xml 0.39
  "RUSTSEC-2026-0195", # quick-xml: same transitive wayland-scanner build-time dependency as RUSTSEC-2026-0194
]
